<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
  <div class="flex flex-col h-screen w-full bg-white text-slate-900 dark:bg-slate-900 dark:text-white font-sans antialiased">

  <header class="flex items-center justify-between px-4 h-14 border-b border-slate-200">
    <div class="flex items-center">
      <svg class="w-8 h-8">
        <path fill="currentColor"></path>
      </svg>
      <span class="font-semibold text-slate-800 text-xl">tailwind</span>
      <span class="font-semibold text-sky-500 text-md">PLAY</span>
    </div>

    <div class="flex-1 flex items-center justify-between p-6 text-md">
      <button class="bg-sky-500 px-4 py-1.5 hover:bg-sky-600 text-white rounded-md shadow-sm font-semibold">Share</button>
    </div>

    <div class="flex items-center space-x-4 text-sm font-medium">
      <span class="text-slate-500 hover:text-slate-900">v4.3.1</span>
    </div>
  </header>

  <section class="w-full flex flex-col border-r border-slate-200 bg-slate-900 text-slate-300 h-1/2 lg:h-full">

    <div class="flex items-center h-12 border-b border-slate-800 px-2 text-sm bg-slate-900 overflow-x-auto">
      <button class="px-4 h-full flex items-center text-sky-400 border-b-2 border-sky-400 font-medium whitespace-nowrap">HTML</button>
      <button class="px-4 h-full flex items-center hover:text-slate-100 transition-colors whitespace-nowrap">CSS</button>
    </div>

    <div class="flex-1 overflow-auto p-4 font-mono text-[13px] sm:text-sm leading-6">
      <div class="flex">
        <div class="w-8 text-gray-500 text-right pr-4 select-none shrink-0">
          1<br>2<br>3<br>4<br>5
        </div>
      </div>
    </div>
  </section>

  <div class="flex-1 p-2 sm:p-4 lg:p-8 overflow-auto">
    <div class="w-full h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex items-center justify-center">
      <div class="h-full w-full flex items-center justify-center bg-gray-50"></div>
    </div>
  </div>
  </div>
</body>
</html>
